[project]
name = "rl-amenability"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "transformers>=4.55",
    "trl>=0.21",
    "datasets>=3.0",
    "accelerate>=1.0",
    "numpy>=1.26",
    "scipy>=1.14",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-mock>=3.14"]
gpu = ["vllm>=0.10"]
# The Modal client belongs on the SUBMITTING machine, not in the GPU image: the
# image is built by Modal from scripts/modal_app.py and never imports modal itself.
# Kept out of "dev" so the CPU test suite does not depend on it.
launch = ["modal>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amenability"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
markers = ["gpu: requires a GPU and real model weights"]
